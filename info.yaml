# Tiny Tapeout project information
project:
  title:        "Self-calibrating charge amplifier"
  author:       "wzw"
  discord:      ""
  description:  "Charge amplifier that measures its own scale: a 6-bit split-cap charge DAC injects a known Q, a decade current DAC emulates leakage, and the whole calibration loop closes on the demo-board MCU."
  language:     "Analog"
  clock_hz:     0       # no clocked digital on die at all

  # 1x2 = 2 tiles = 161.00 x 225.76 um, the DIEAREA of tt_analog_1x2.def and
  # the exact bbox of the signed-off GDS (checked by scripts/tt_precheck_local.py).
  # The blocks are 23 036 um2 = 63.4 % of this tile.
  tiles: "1x2"

  analog_pins:  2
  uses_vapwr:   false   # 1.8 V VDPWR only

  top_module:  "tt_um_wzw_qamp"

  source_files:
    - "project.v"

# Descriptions must be non-empty for exactly the pins that are wired, and
# empty for the rest - precheck fails in both directions.
pinout:
  # Inputs - qdac code, reset, and one of the three step-driver strobes
  ui[0]: "B0 - charge-DAC code bit 0 (LSB)"
  ui[1]: "B1 - charge-DAC code bit 1"
  ui[2]: "B2 - charge-DAC code bit 2"
  ui[3]: "B3 - charge-DAC code bit 3"
  ui[4]: "B4 - charge-DAC code bit 4"
  ui[5]: "B5 - charge-DAC code bit 5 (MSB)"
  ui[6]: "RST - integrator reset (hold high through power-up)"
  ui[7]: "TRIGC - fire calibration step, active HIGH (st -> vcal, 1.0 V)"

  # Outputs - none. The integrator output leaves on ua[0], not through a
  # comparator; the whole ramp goes to the demo board's 12-bit ADC.
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins - used as INPUTS ONLY (uio_oe tied low in the GDS)
  uio[0]: "TRIGT - fire trim step, active HIGH (st -> vtrim, ~204 mV)"
  uio[1]: "TRIGN - step-driver pull-down, active high = idle (st -> VSS)"
  uio[2]: "S0 - leakage DAC decade select, 1 nA (one-hot with S1/S2)"
  uio[3]: "S1 - leakage DAC decade select, 100 pA"
  uio[4]: "S2 - leakage DAC decade select, 10 pA"
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins
  ua[0]: "VOUT - integrator output to the MCU ADC (0.9 V at reset)"
  ua[1]: "SENSE - summing node (virtual ground, 0.90 V). Piezo sensor input, <10 pF. Leave open for self-test"
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
